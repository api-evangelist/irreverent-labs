name: Irreverent Labs
description: >-
  Irreverent Labs is a Bellevue, Washington startup founded in 2021 and backed by
  Andreessen Horowitz (a16z), Samsung Next, and Michael Ovitz. The company began by
  building MechaFightClub, a web3 gaming property, then pivoted to generative AI,
  developing video foundation models intended to let creators, game studios, and
  developers produce short-form video from natural-language prompts. Its current
  public product is Supermodel (supermodel.ai), an autonomous on-chain trading agent
  that watches top Hyperliquid wallets, scores their track records, and fuses crowd,
  technical, and prediction-market signals into trades. The company has publicly
  signaled intent to ship a developer API for its video generation models, but no
  public API, developer portal, OpenAPI, or SDK has been released as of this profile.
